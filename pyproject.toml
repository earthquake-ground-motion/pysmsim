[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pysmsim"
version = "0.0.1"
description = "Python implementation of the SMSIM stochastic ground-motion simulation method (Boore, 2003)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Graeme Weatherill", email = "graeme.weatherill@gfz.de" }]
keywords = ["seismology", "ground motion", "stochastic method", "random vibration theory", "SMSIM"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.61",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Exploring the workflows interactively in Jupyter
notebook = [
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[project.urls]
Repository = "https://github.com/earthquake-ground-motion/pysmsim"

# Command-line entry point; the module is added in a later step.
[project.scripts]
pysmsim = "pysmsim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pysmsim"]

[tool.hatch.build.targets.sdist]
exclude = ["papers/", "oracle/build/", "notebooks/"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["papers", "oracle/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "NPY", "D", "RUF"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["pysmsim"]

[[tool.mypy.overrides]]
module = ["numba.*", "scipy.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "golden: compares against outputs from the Fortran oracle",
    "slow: long-running tests, such as time-domain statistics",
]

[tool.coverage.run]
source = ["pysmsim"]
branch = true
